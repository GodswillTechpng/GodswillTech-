<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GodswillTech | Computer & Hardware Technology</title>

  <meta name="description"
        content="GodswillTech provides practical computer hardware, engineering, troubleshooting guides and technology knowledge.">

  <meta name="keywords"
        content="GodswillTech, computer hardware, computer engineering, laptop repair, technology, PC troubleshooting">

  <meta name="author" content="GodswillTech">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1120;
      color: #ffffff;
      line-height: 1.6;
    }

    /* NAVIGATION */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(11, 17, 32, 0.97);
      border-bottom: 1px solid #243047;
      padding: 16px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
    }

    .logo span {
      color: white;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #38bdf8;
    }


    /* HERO SECTION */

    .hero {
      min-height: 90vh;

      display: flex;
      align-items: center;

      padding: 70px 7%;

      background:
        radial-gradient(
          circle at top right,
          #12395a,
          transparent 35%
        ),
        #0b1120;
    }

    .hero-content {
      max-width: 800px;
    }

    .badge {
      display: inline-block;

      padding: 8px 15px;

      border: 1px solid #38bdf8;

      border-radius: 30px;

      color: #38bdf8;

      margin-bottom: 20px;

      font-size: 14px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 75px);

      line-height: 1.05;

      margin-bottom: 25px;
    }

    h1 span {
      color: #38bdf8;
    }

    .hero p {
      max-width: 650px;

      color: #b7c3d4;

      font-size: 18px;

      margin-bottom: 30px;
    }

    .buttons {
      display: flex;

      gap: 15px;

      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;

      padding: 13px 22px;

      border-radius: 8px;

      text-decoration: none;

      font-weight: bold;

      transition: 0.3s;
    }

    .primary {
      background: #38bdf8;

      color: #06101c;
    }

    .primary:hover {
      transform: translateY(-3px);

      background: #7dd3fc;
    }

    .secondary {
      border: 1px solid #52627a;

      color: white;
    }

    .secondary:hover {
      border-color: #38bdf8;

      color: #38bdf8;
    }


    /* GENERAL SECTIONS */

    section {
      padding: 80px 7%;
    }

    .section-title {
      text-align: center;

      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 36px;

      margin-bottom: 10px;
    }

    .section-title p {
      color: #9ca9bb;
    }


    /* SERVICES */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));

      gap: 22px;
    }

    .card {
      background: #111a2d;

      border: 1px solid #25334b;

      border-radius: 14px;

      padding: 28px;

      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);

      border-color: #38bdf8;
    }

    .icon {
      font-size: 35px;

      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #aeb9c9;
    }


    /* ABOUT */

    .about {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 50px;

      align-items: center;
    }

    .about h2 {
      font-size: 40px;

      margin-bottom: 20px;
    }

    .about p {
      color: #b6c1d0;

      margin-bottom: 15px;
    }

    .about-box {
      background:
        linear-gradient(
          145deg,
          #13243b,
          #0e1728
        );

      border: 1px solid #29405d;

      padding: 40px;

      border-radius: 18px;

      text-align: center;
    }

    .about-box strong {
      font-size: 50px;

      color: #38bdf8;

      display: block;
    }


    /* CONTACT */
